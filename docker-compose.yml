version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aiops-postgres
    restart: always
    environment:
      POSTGRES_DB: aiops_db
      POSTGRES_USER: aiops_admin
      POSTGRES_PASSWORD: AiOpsSecurePass2026!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops_admin -d aiops_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  redis:
    image: redis:7-alpine
    container_name: aiops-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiops-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "aiops-backend"
      APP_ENV: "development"
      DATABASE_URL: "postgresql://aiops_admin:AiOpsSecurePass2026!@postgres:5432/aiops_db"
      REDIS_URL: "redis://redis:6379/0"
      LOG_LEVEL: "INFO"
      ENABLE_CHAOS: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 10s

      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

volumes:
  postgres_data:
  redis_data:
